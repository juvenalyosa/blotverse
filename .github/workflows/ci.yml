name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtiff-dev libeigen3-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libtiff eigen
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validation smoke run
        run: build/apps/blotverse validate --out build/val --experiments 40 --gradient-experiments 10 --permutations 50 || test $? -eq 3
