# WB_UFM1 pair: 687x550 (4x4 binning), 12 lanes, aligned (shift 0, 0).
# Lower exposure listed first (exposure times are not in the files; the
# file names give the order). Lane centres from BlotVerse's comb fit on the
# lower exposure, band rows from row profiles of the lower exposure; every
# band row seen in >= 2 lanes, the low continuous band included.
name: UFM1 blot (WB_UFM1), lower and normal exposure
lane_width: 26
band_half_height: 4
refine_rows: 4
exposures:
  - {image: WB_UFM1_lower_exposure.tif}
  - {image: WB_UFM1.tif}
lanes: [{x: 170}, {x: 203}, {x: 238}, {x: 272}, {x: 305}, {x: 338}, {x: 372}, {x: 406}, {x: 440}, {x: 474}, {x: 507}, {x: 541}]
bands:
  - {name: r223, y: 223}
  - {name: r260, y: 260}
  - {name: doublet, y: 302, half_height: 7}
  - {name: low, y: 412, half_height: 5}
